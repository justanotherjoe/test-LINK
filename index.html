  <meta charset="UTF-8">
  <title>Agvance SKY Order: Blends</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #player-wrapper {
      position: relative;
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
    }
    #vimeo-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    #play-overlay {
      position: absolute;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }
    #play-overlay:hover #play-btn {
      background: #1ab7ea;
      transform: scale(1.05);
    }
    #play-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #00adef;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 4px 24px rgba(0,173,239,0.4);
    }
    #play-btn svg {
      width: 40px;
      height: 40px;
      fill: #fff;
      margin-left: 6px;
    }
    #play-text {
      color: #aaa;
      margin-top: 20px;
      font-size: 18px;
      letter-spacing: 0.5px;
    }
    #now-playing {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #555;
      font-size: 13px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="player-wrapper">
    <div id="play-overlay" onclick="startPlayback()">
      <button id="play-btn">
        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"></polygon></svg>
      </button>
      <p id="play-text">Click to play with sound</p>
    </div>
    <iframe id="vimeo-iframe" allowfullscreen="" allow="autoplay; fullscreen">
    </iframe>
  </div>
  <div id="now-playing"></div>

  <script src="https://player.vimeo.com/api/player.js"></script>
  <script>
    // Showcase 12391021 — Blend Shed videos (with unlisted hashes)
    // Plays fullscreen automatically after clicking play
    var VIDEOS = [
      { id: '1223778536', h: '5bcaf7edeb', title: 'Viewing Blend List' },
      { id: '1223778506', h: 'c3dd05bf6f', title: 'Add New Blend: Location, Field' },
      { id: '1223778503', h: '5dfb6b4bdb', title: 'Add New Blend: Order Details' },
      { id: '1223778504', h: 'b7a67d8013', title: 'Add New Blend: Products' },
      { id: '1223778502', h: 'f0e195e240', title: 'Add New Blend: Pricing' },
      { id: '1223778554', h: '33327643df', title: 'Add New Blend: Notes & Additional Info' },
      { id: '1223778544', h: '8b910debc4', title: 'Add New Blend: Batch Breakdown' }
    ];

    var currentIndex = 0;
    var player = null;

    function getEmbedUrl(index) {
      var v = VIDEOS[index];
      return 'https://player.vimeo.com/video/' + v.id + '?h=' + v.h + '&autoplay=1';
    }

    function goFullscreen() {
      var wrapper = document.getElementById('player-wrapper');
      if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen();
      } else if (wrapper.webkitRequestFullscreen) {
        wrapper.webkitRequestFullscreen();
      } else if (wrapper.msRequestFullscreen) {
        wrapper.msRequestFullscreen();
      } else if (wrapper.mozRequestFullScreen) {
        wrapper.mozRequestFullScreen();
      }
    }

    function startPlayback() {
      var iframe = document.getElementById('vimeo-iframe');
      iframe.src = getEmbedUrl(currentIndex);
      iframe.style.display = 'block';
      document.getElementById('play-overlay').style.display = 'none';
      updateNowPlaying();

      iframe.addEventListener('load', function onLoad() {
        iframe.removeEventListener('load', onLoad);
        attachPlayer();
        // Go fullscreen once the first video loads
        goFullscreen();
      });
    }

    function attachPlayer() {
      var iframe = document.getElementById('vimeo-iframe');
      player = new Vimeo.Player(iframe);

      player.on('ended', function() {
        currentIndex++;
        if (currentIndex >= VIDEOS.length) {
          currentIndex = 0;
        }
        // Swap iframe src for next video (more reliable with unlisted/hash videos)
        iframe.src = getEmbedUrl(currentIndex);
        updateNowPlaying();
      });
    }

    function updateNowPlaying() {
      document.getElementById('now-playing').textContent =
        'Now playing (' + (currentIndex + 1) + '/' + VIDEOS.length + '): ' + VIDEOS[currentIndex].title;
    }
  </script>
